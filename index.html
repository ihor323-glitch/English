<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2f2f2f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="English">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>English</title>
<style>
:root{--bg:#2f2f2f;--row1:#333;--row2:#3a3a3a;--green:#46b800;--green2:#3a9a00;--pill:#efefef;--ink:#2c2c2c;--text:#fff;--mut:#a9a9a9;--bad:#e5484d;--sheet:#3b3b3b;--badge:46px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{min-height:100vh;min-height:100dvh}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{cursor:default}
.top{display:flex;align-items:center;gap:8px;padding:14px 16px;min-height:64px}
.top .sp{flex:1}
.top h1{flex:1;margin:0;font-size:18px;text-align:center;font-weight:700}
.ic{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff}
.ic svg{width:26px;height:26px;fill:currentColor}
.ic.sm{width:40px;height:40px}.ic.sm svg{width:24px;height:24px}
.ic:active{background:#ffffff18}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:12px 20px 32px}
.center h2{font-size:22px;margin:0 0 16px;font-weight:700}
.center p{color:#e6e6e6;font-size:18px;line-height:1.35;margin:0 0 22px}
.pill{background:var(--pill);color:var(--ink);border-radius:999px;position:relative;overflow:hidden;font-weight:700}
.prog{width:100%;max-width:420px;height:64px;font-size:26px;display:flex;align-items:center;justify-content:center;margin-bottom:44px}
.prog .fill{position:absolute;left:0;top:0;bottom:0;background:var(--green);border-radius:999px}
.prog span{position:relative}
.tl{display:flex;overflow-x:auto;width:100%;padding:0 4px 4px;margin-bottom:36px;scrollbar-width:none}
.tl::-webkit-scrollbar{display:none}
.tli{flex:0 0 94px;text-align:center}
.tli .n{height:30px;font-size:24px;font-weight:700;line-height:30px}
.tli .dr{position:relative;height:40px}
.tli .dr::before{content:"";position:absolute;left:0;right:0;top:19px;border-top:3px dashed var(--green)}
.tli:first-child .dr::before{left:50%}.tli:last-child .dr::before{right:50%}
.tli .dot{position:absolute;left:50%;top:2px;width:36px;height:36px;margin-left:-18px;border-radius:50%;background:var(--green);border:3px solid var(--green)}
.tli.empty .dot{background:var(--bg);}
.tli .lb{font-size:19px;color:#f1f1f1;margin-top:6px}
.btn{display:block;width:100%;max-width:420px;border-radius:999px;padding:17px 20px;font-size:21px;font-weight:700;text-align:center;margin:0 auto 14px}
.btn.green{background:var(--green);color:#fff;border:3px solid #fff;padding:15px 20px;max-width:380px}
.btn.green:active{background:var(--green2)}
.btn.light{background:var(--pill);color:var(--ink);font-size:20px;padding:18px 16px}
.btn.light:active{background:#d7d7d7}
.btn.light:disabled{background:#7a7a7a;color:#3d3d3d}
.btn.ghost{background:#4a4a4a;color:#fff;font-size:18px;padding:15px}
.link{display:block;margin:6px auto;padding:10px 16px;font-size:22px;font-weight:600;color:#fff}
.link.small{font-size:17px;color:var(--mut);font-weight:500}
.cnt{position:absolute;right:10px;top:50%;transform:translateY(-50%);min-width:44px;height:44px;border-radius:22px;background:var(--green);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;padding:0 8px}
.btn.light.rel{position:relative}
.stack{width:100%;max-width:440px;margin:0 auto}
.green-t{color:#46d800}
/* list */
.search{flex:1;height:48px;border-radius:12px;background:#454545;border:0;color:#fff;font-size:18px;padding:0 14px;min-width:0;outline:0}
.search::placeholder{color:#9b9b9b}
.tabs{display:flex;margin:4px 12px 10px;background:#404040;border-radius:12px;padding:4px}
.tabs button{flex:1;text-align:center;padding:12px 2px;border-radius:9px;font-size:16px;font-weight:700;color:#f2f2f2;white-space:nowrap}
.tabs button.on{background:var(--green);color:#fff}
.letters{display:flex;gap:8px;overflow-x:auto;padding:4px 12px 12px;scrollbar-width:none}
.letters::-webkit-scrollbar{display:none}
.letters button{flex:0 0 auto;min-width:50px;height:50px;border-radius:14px;background:var(--pill);color:var(--ink);font-size:23px;font-weight:700;padding:0 10px}
.letters button.on{background:var(--green);color:#fff}
.rows{flex:1}
.row{display:flex;align-items:center;gap:4px;padding:6px 6px 6px 16px;min-height:62px;background:var(--row1);cursor:pointer}
.row:nth-child(even){background:var(--row2)}
.row .rt{flex:1;min-width:0}
.row .en{font-size:22px;line-height:1.2;word-break:break-word}
.row .ru{font-size:14px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .okd{width:10px;height:10px;border-radius:50%;background:var(--green);flex:0 0 auto;margin-right:6px}
.row.sel{outline:3px solid var(--green);outline-offset:-3px}
.exr{display:flex;align-items:flex-start;gap:6px;margin:0 0 18px}.exb{flex:1;min-width:0;cursor:pointer}.exen{font-size:21px;line-height:1.35}.exen b{color:#5fe000;font-weight:600}.extr{margin-top:6px;font-size:19px;line-height:1.35;background:#474747;color:transparent;border-radius:6px;padding:3px 6px;user-select:none;-webkit-user-select:none}.extr.on{background:none;color:#fff;padding:3px 0;user-select:text;-webkit-user-select:text}
.bslots{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;min-height:60px;margin:6px 0 22px}
.bsl{min-width:34px;height:54px;border-bottom:3px solid #8a8a8a;font-size:32px;font-weight:700;color:#fff;padding:0 4px;text-align:center}
.bsl.w{min-width:76px;font-size:24px}
.bsl.hint{color:#ffd36b;border-color:#ffd36b}
.bsl.ok{color:#8aff3f;border-color:var(--green)}.bsl.bad{color:#ff7b7f;border-color:var(--bad)}
.btiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:8px}
.btile{min-width:48px;height:54px;border-radius:12px;background:var(--pill);color:var(--ink);font-size:27px;font-weight:700;padding:0 12px}
.btile.w{font-size:21px}.btile.sp,.bsl.sp{color:#7a7a7a}.btile.sp{background:#cfcfcf}.btile.used{opacity:0;pointer-events:none}
.amb{background:#3a3a3a;border-radius:12px;padding:10px;margin:8px 0}.ambq{color:#ffcf6b;font-size:15px;margin-bottom:6px;word-break:break-word}.ambopt{display:block;width:100%;text-align:left;background:#4a4a4a;color:#fff;border-radius:10px;padding:10px 12px;margin-top:6px;font-size:16px;border:2px solid transparent}.ambopt.on{border-color:var(--green);background:#2d4a1a}
.stg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stc{background:#3a3a3a;border-radius:14px;padding:14px 6px;text-align:center}.stc b{display:block;font-size:26px;color:#8aff3f}.stc span{font-size:13px;color:#cfcfcf}
.lvb{flex:0 0 auto;min-width:44px;text-align:center;padding:5px 8px;border-radius:9px;font-size:16px;font-weight:800;color:#fff;margin-right:2px}
.lvb.A1{background:#47b800}.lvb.A2{background:#1b86b5}.lvb.B1{background:#d98a00}.lvb.M{background:#7a5bd6}
.empty-note{padding:40px 24px;text-align:center;color:var(--mut);font-size:17px;line-height:1.4}
.selbar{position:sticky;bottom:0;padding:12px 16px calc(12px + var(--badge) + env(safe-area-inset-bottom));background:linear-gradient(#2f2f2f00,#2f2f2f 30%)}
/* quiz */
.qwrap{flex:1;display:flex;flex-direction:column;padding:0 18px 24px;max-width:560px;width:100%;margin:0 auto}
.qprompt{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 4px;min-height:140px}
.shuf{background:none;border:0;color:#8e8e8e;width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin:0 0 6px;padding:0}.shuf svg{width:24px;height:24px;fill:currentColor}.shuf.on{color:#46b800;background:rgba(70,184,0,.14)}
.qprompt .big{font-size:36px;font-weight:700;line-height:1.2;word-break:break-word}
.qprompt .big.ru{font-size:30px}
.qprompt .hint{color:var(--mut);margin-top:10px;font-size:16px}
.spk{margin-top:16px;width:64px;height:64px;border-radius:50%;background:#4a4a4a;display:inline-flex;align-items:center;justify-content:center}
.spk svg{width:32px;height:32px;fill:#fff}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--pill);color:var(--ink);border-radius:999px;padding:15px 22px;font-size:20px;font-weight:600;text-align:center;line-height:1.25}
.opt.ok{background:var(--green);color:#fff}
.opt.bad{background:var(--bad);color:#fff}
.opt:disabled{opacity:1}
.opt.dim{opacity:.45}
.ainp{width:100%;height:60px;border-radius:16px;border:2px solid #5a5a5a;background:#3d3d3d;color:#fff;font-size:22px;padding:0 16px;outline:0;text-align:center}
.ainp:focus{border-color:var(--green)}
.ainp.ok{border-color:var(--green);background:#2d4a1a}.ainp.bad{border-color:var(--bad);background:#4d2a2b}
.fb{min-height:76px;margin-top:8px;text-align:center}
.qwrap.answered{padding-bottom:calc(150px + var(--badge))}
.qbottom{display:none;position:fixed;left:0;right:0;bottom:0;z-index:5;background:linear-gradient(#2f2f2f00,var(--bg) 22%);padding:22px 18px calc(14px + var(--badge) + env(safe-area-inset-bottom));text-align:center}
.qbottom.on{display:block}
.qbottom .qex{display:block;margin:0 auto 6px;padding:8px 16px;font-size:19px;color:#fff}
.qbottom .qrow{display:flex;align-items:center;gap:8px;max-width:560px;margin:0 auto}.qbottom .qrow .btn{flex:1;margin:0;width:auto;font-size:21px;padding:15px}.qbottom .qrow .ic{width:52px;height:52px;flex:0 0 auto}.qbottom .qrow .ic svg{width:34px;height:34px}
.fb .ans{font-size:20px;font-weight:700}
.fb .ans b{color:#8aff3f}
.fb{margin-bottom:12px}
.fb .tr{font-size:25px;font-weight:700;color:#fff;line-height:1.25;margin-top:6px}
.fb .gr{font-size:18px;line-height:1.35;color:#ffd36b;margin-top:8px;font-weight:600}
.fb .exm{font-size:18px;line-height:1.4;color:#fff;margin:10px auto 0;padding:10px 14px;background:#3a3a3a;border-left:4px solid #46b800;border-radius:10px;text-align:left}
.fb .sub{color:#cfcfcf;margin-top:6px;font-size:16px;line-height:1.35;white-space:pre-line}
.qbar{height:6px;background:#444;margin:0 18px 6px;border-radius:3px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--green);transition:width .25s}
.small-btn{padding:12px 16px;color:#cfcfcf;font-size:17px}
/* cards */
.card{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 24px}
.card .en{font-size:40px;font-weight:700;line-height:1.15;word-break:break-word}
.card .ru{font-size:26px;color:#8aff3f;margin-top:18px;line-height:1.3}
.card .note{margin-top:18px;color:#d6d6d6;font-size:17px;line-height:1.45;white-space:pre-line;background:#3a3a3a;border-radius:14px;padding:12px 16px;text-align:left;max-width:440px}
.card .cnt2{color:var(--mut);margin-top:22px;font-size:16px}
.navrow{display:flex;gap:12px;padding:0 18px calc(22px + var(--badge));max-width:560px;width:100%;margin:0 auto}
.navrow .btn{margin:0;flex:1}
.cbar{align-items:center;gap:8px}.cbar .ic{width:52px;height:52px;flex:0 0 auto}.cbar .ic svg{width:34px;height:34px}
/* sheet */
#sheetbg{position:fixed;inset:0;background:#000a;display:none;z-index:20;align-items:flex-end;justify-content:center}
#sheetbg.on{display:flex}
#sheet{background:var(--sheet);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
#sheet .sh-h{display:flex;align-items:center;gap:8px}
#sheet .big{font-size:30px;font-weight:700;flex:1;line-height:1.2;word-break:break-word}
#sheet .sh-ru{font-size:21px;color:#8aff3f;margin:8px 0 10px;line-height:1.35}
#sheet .note{background:#333;border-radius:12px;padding:12px 14px;font-size:16px;line-height:1.45;color:#ddd;white-space:pre-line;margin-bottom:10px}
#sheet .meta{color:var(--mut);font-size:14px;margin-bottom:14px}
#sheet h3{margin:0 0 12px;font-size:21px}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;color:var(--mut);font-size:14px;margin-bottom:5px}
.fld input,.fld textarea,.ta{width:100%;border-radius:12px;border:2px solid #555;background:#2f2f2f;color:#fff;font-size:17px;padding:12px;outline:0;font-family:inherit}
.fld input:focus,.fld textarea:focus,.ta:focus{border-color:var(--green)}
.ta{min-height:150px;resize:vertical}
.srow{display:flex;gap:10px;margin-top:6px}
.srow .btn{margin:0;font-size:18px;padding:14px 10px}
.menuitem{display:block;width:100%;text-align:left;padding:16px 8px;font-size:19px;border-bottom:1px solid #4a4a4a}
.menuitem:last-child{border:0}
/* settings */
.sec{padding:0 16px 16px}
.sec h3{margin:18px 0 8px;font-size:15px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.card2{background:#3a3a3a;border-radius:16px;overflow:hidden}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px;font-size:18px;border-bottom:1px solid #484848;width:100%;text-align:left}
.set:last-child{border:0}
.set small{display:block;color:var(--mut);font-size:13px;margin-top:3px;line-height:1.3}
.sw{width:52px;height:30px;border-radius:15px;background:#666;position:relative;flex:0 0 auto}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--green)}.sw.on::after{left:25px}
select.sel{background:#2f2f2f;color:#fff;border:2px solid #555;border-radius:10px;padding:8px;font-size:17px}
.seg{display:flex;background:#404040;border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;padding:11px 6px;border-radius:9px;font-size:16px;font-weight:700;color:#eee}
.seg button.on{background:var(--green);color:#fff}
.pre{background:#333;border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.5;margin:12px 0;white-space:pre-wrap;word-break:break-word}
.pre.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#000d;color:#fff;padding:12px 18px;border-radius:14px;font-size:16px;opacity:0;transition:.2s;pointer-events:none;z-index:50;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.bakn{width:100%;max-width:420px;background:#3a3a3a;border-left:4px solid #ffcf6b;border-radius:12px;padding:12px 14px;margin:0 0 26px;text-align:left;font-size:16px;line-height:1.4;color:#e6e6e6}
.bakn .bb{display:flex;gap:8px;margin-top:10px}.bakn button{flex:1;border-radius:999px;padding:10px;font-size:16px;font-weight:700}
.bakn .bk1{background:var(--green);color:#fff}.bakn .bk2{background:#4a4a4a;color:#fff}
.bgmark{position:fixed;inset:0;z-index:-1;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheetbg"><div id="sheet"></div></div>
<div id="toast"></div>
<input type="file" id="fileimp" accept=".csv,.txt,.tsv,.json,.md,text/*,application/json" hidden>
<input type="file" id="filebak" accept=".json,application/json" hidden>
<script src="words.js"></script>
<script>
(function(){
'use strict';
/* ---------- utils ---------- */
const $=s=>document.querySelector(s);

const wordsRu=n=>n+' '+plural(n,'слово','слова','слов');
const ICO={

 plus:'<svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>',

/* ---------- state ---------- */
const KEY='ew_state_v1';
function defaults(){return{v:1,app:'english-words',st:{},custom:[],ov:{},set:{sound:true,rate:0.9},favInit:false,log:[],sess:[],ex:{},packs:[],seed:{}}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);const d=defaults();return Object.assign(d,o,{set:Object.assign(d.set,o.set||{})})}}catch(e){}return defaults()}
let S=load();
let saveFailed=false,saveT=null;
function saveNow(){clearTimeout(saveT);saveT=null;try{localStorage.setItem(KEY,JSON.stringify(S));saveFailed=false}catch(e){if(!saveFailed)toast('Не удалось сохранить данные на устройстве');saveFailed=true}}
// several changes per answer are merged into one write; pending data is flushed when the app goes to background
function save(){if(!saveT)saveT=setTimeout(saveNow,300)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&saveT)saveNow()});
window.addEventListener('pagehide',()=>{if(saveT)saveNow()});
const ens=k=>S.st[k]||(S.st[k]={});

/* ---------- words ---------- */
let WORDS=[],BYKEY=new Map();
const normX=s=>String(s==null?'':s).replace(/[’‘`]/g,"'").replace(/\s+/g,' ').trim();
let BYEXACT=new Map(),BYLOWER=new Map();
function buildWords(){
  WORDS=[];BYKEY=new Map();BYEXACT=new Map();BYLOWER=new Map();
  const put=(w,x)=>{WORDS.push(w);BYKEY.set(w.key,w);BYEXACT.set(x,w);const l=x.toLowerCase();let a=BYLOWER.get(l);if(!a){a=[];BYLOWER.set(l,a)}a.push(w)};
  // ID: lowercase text; if two cards differ only by case, the later one gets its own ID (lower~Exact)
  const mk=(base,x)=>{let key=base;if(BYKEY.has(key))key=norm(x)+'~'+x;return BYKEY.has(key)?null:key};
  for(const b of (window.BASE_WORDS||[])){
    const x=normX(b.en);if(BYEXACT.has(x))continue;
    const key=b.id&&!BYKEY.has(b.id)?b.id:mk(norm(x),x);if(!key)continue;
    put(Object.assign({},b,{key,base:1}),x);
  }
  S.custom.forEach((c,i)=>{
    const x=normX(c.en);if(!x||BYEXACT.has(x))return;
    const key=mk(norm(x),x);if(!key)return;
    put({n:100000+i,en:c.en,ru:c.ru||'',note:c.note||'',lv:'Мои',tp:c.tp||'Мои слова',key,cust:1,ci:i},x);
  });
  for(const k in S.ov){const w=BYKEY.get(k);if(!w)continue;const o=S.ov[k];if(o.ru)w.ru=o.ru;if(o.note!==undefined)w.note=o.note}
  if(!S.favInit){for(const w of WORDS){if(w.star)ens(w.key).f=1}S.favInit=true;save()}
}
/* Card lookup: 1) exact match (case kept, extra spaces ignored); 2) case-insensitive, auto only if there is exactly one match; 3) several matches -> candidates for the user to choose */
function resolveCard(text){
  const x=normX(text);if(!x)return null;
  const e=BYEXACT.get(x);if(e)return{w:e,how:'exact'};
  const c=BYLOWER.get(x.toLowerCase())||[];
  if(c.length===1)return{w:c[0],how:'ci'};
  if(c.length>1)return{cands:c.slice()};
  return null;
}
const E=w=>S.st[w.key]||{};
const learned=w=>(E(w).l||0)>0;
const hidden=w=>!!E(w).h;
const isFav=w=>!!E(w).f;
/* hard words: 3+ sessions with a mistake (ec); 3 first-try correct answers in a row (ok) clear the flag */
const HARD_N=3;
const isHard=w=>(E(w).ec||0)>=HARD_N;
function hardErr(w){const e=ens(w.key);e.ec=(e.ec||0)+1;e.ok=0;save()}
function hardOk(w){const e=ens(w.key);e.ok=(e.ok||0)+1;if(e.ok>=HARD_N){e.ec=0;e.ok=0}save()}
const lists={
  all:()=>WORDS,
  unlearned:()=>WORDS.filter(w=>!learned(w)&&!hidden(w)),
  learned:()=>WORDS.filter(w=>learned(w)&&!hidden(w)),
  due:()=>{const t=Date.now();return WORDS.filter(w=>learned(w)&&!hidden(w)&&(E(w).d||0)<=t)},
  today:()=>{const t=sod();return WORDS.filter(w=>learned(w)&&!hidden(w)&&E(w).l>=t)},
  wrong:()=>WORDS.filter(w=>E(w).w&&!hidden(w)),
  hard:()=>WORDS.filter(w=>isHard(w)&&!hidden(w)),
  fav:()=>WORDS.filter(isFav),
  hidden:()=>WORDS.filter(hidden)
};
const learnOrder=()=>lists.unlearned().sort((a,b)=>(a.cust?0:1)-(b.cust?0:1)||a.n-b.n);
function markLearned(w,known){const e=ens(w.key);const now=Date.now();if(known){e.l=now-DAY;e.s=4;e.d=dueIn(7)}else{e.l=now;e.s=1;e.d=dueIn(1)}save()}
function nodash(s){return String(s).replace(/\s+/g,' ').trim()}

let voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/^en[-_]US/i.test(v.lang)&&/samantha|ava|allison|nicky|zoe|siri/i.test(v.name))||vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}catch(e){}}

  if(!('speechSynthesis' in window))return;

  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/…|\.\.\./g,' ').replace(/\s*\/\s*/g,', '));u.lang='en-US';if(voice)u.voice=voice;u.rate=S.set.rate||0.9;speechSynthesis.speak(u)}catch(e){}

/* ---------- quiz engine ---------- */
const MIX=['ru','en','listen','build','ru','en','listenbuild','write'];
function pickType(mode){return mode==='mixed'?MIX[Math.floor(Math.random()*MIX.length)]:mode}
function startQuiz(kind,words,mode,extra){
  Q={t0:Date.now(),kind,mode,items:[],done:0,total:words.length,first:0,miss:0,locked:false,extra:extra||{},cur:null};
  Q.items=words.map(w=>({w,steps:kind==='learn'?['ru','build']:[pickType(mode)],si:0,miss:false,counted:false}));
  if(kind==='learn')Q.items=shuffle(Q.items);
  if(Q.extra.prep)Q.extra.prep(Q);
  Q.near=nearKeys(words,Q.extra);
  go('quiz',{},true);
}
const meanings=w=>nodash(w.ru).split(' · ').map(x=>x.trim()).filter(Boolean);
const MI={};
function shortRu(w){const m=meanings(w);if(m.length<2)return m[0]||w.ru;const i=((MI[w.key]==null?Math.floor(Math.random()*m.length):MI[w.key]+1))%m.length;MI[w.key]=i;return m[i]}
const anyRu=w=>{const m=meanings(w);return m[Math.floor(Math.random()*m.length)]||w.ru};
const kindOf=w=>w._k||(w._k=(w.en.split(' ').length>2||/[.?!…]$/.test(w.en))?'p':'w');
const STOPW=new Set(['the','and','for','with','you','your','that','this','from','are','was','have','has','not','but','его','для','что','как','при','или','это','над','под','мне','меня','тебя','тебе','вас','вам','нас','нам','они','она','оно','все','всё','так','уже','ещё']);
const toks=t=>String(t).toLowerCase().replace(/[^a-zа-яё' ]/g,' ').split(/\s+/).filter(x=>x.length>2&&!STOPW.has(x));
const stem=t=>t.length>5?t.slice(0,t.length-2):t;
// token stems are computed once per card (the cache is dropped when buildWords() recreates the cards)
const tokStems=w=>w._ts||(w._ts={e:new Set(toks(w.en).map(stem)),r:new Set(toks(w.ru).map(stem))});
const meanN=w=>w._mn||(w._mn=meanings(w).map(norm));
/* "recent" words for distractors: the last 30 learned words, the words of a short session itself, and the pack in a pack session */
function nearKeys(words,extra){
  const s=new Set(lists.learned().sort((a,b)=>(E(b).l||0)-(E(a).l||0)).slice(0,30).map(w=>w.key));
  if(words.length<=30)words.forEach(w=>s.add(w.key));
  const pk=extra&&extra.pid?getPack(extra.pid):null;if(pk)pk.keys.forEach(k=>s.add(k));
  return s;
}
/* Wrong options that are easy to confuse with the answer. Each card gets a score:
   shares an English word (good afternoon / good evening) +4, shares a Russian word stem +2,
   neighbour in the same topic +3..+1, learned recently +3, same kind (word vs phrase) +1 / otherwise -3, plus a little randomness.
   A card with the same meaning is never offered (it would be a second correct answer, e.g. hi / hello for «привет»).
   At least one option is a recently learned word, so the answer can't be found by elimination. */
function distractors(w,field,correct){
  const myM=new Set(meanN(w)),me=tokStems(w),kd=kindOf(w),near=(Q&&Q.near)||new Set();
  const sameMeaning=x=>meanN(x).some(m=>myM.has(m));
  const sc=[];
  for(const x of WORDS){
    if(x.key===w.key||sameMeaning(x))continue;
    const t=tokStems(x),isNear=near.has(x.key);let s=0;
    for(const v of t.e)if(me.e.has(v)){s+=4;break}
    for(const v of t.r)if(me.r.has(v)){s+=2;break}
    if(x.tp===w.tp){const d=Math.abs(x.n-w.n);s+=d<=3?3:d<=8?2:1}
    if(isNear)s+=3;
    s+=kindOf(x)===kd?1:-3;
    if(s>0)sc.push({x,near:isNear,s:s+Math.random()*2});
  }
  sc.sort((a,b)=>b.s-a.s);
  const out=[],seen=new Set([norm(correct)]);
  const take=x=>{const d=field==='ru'?anyRu(x):x.en,nd=norm(d);if(!d||seen.has(nd))return false;seen.add(nd);out.push(d);return true};
  const nr=sc.find(c=>c.near);if(nr)take(nr.x);
  for(const c of sc){if(out.length>=3)break;take(c.x)}
  for(let i=0;out.length<3&&i<300;i++){const x=WORDS[Math.floor(Math.random()*WORDS.length)];if(x.key!==w.key&&!sameMeaning(x))take(x)}
  return out;
}
function enNorm(s){return norm(s).replace(/…|\.\.\./g,' ').replace(/[.,!?;:"“”]/g,'').replace(/\s+/g,' ').trim()}
function enAnswers(w){const s=new Set([enNorm(w.en)]);if(w.en.includes(' / '))w.en.split(' / ').forEach(p=>s.add(enNorm(p)));return s}
function quizHtml(){
  if(!Q)return topbar('')+'<div class="empty-note">Нет активной сессии</div>';
  const it=Q.items[0];
  if(!it){return finishQuiz()}
  const w=it.w,type=it.steps[it.si];
  const prog=Math.round(Q.done/Q.total*100);
  let body='';
  Q.locked=false;
  if(type==='ru'||type==='en'||type==='listen'){
    const field=type==='en'?'en':'ru';
    const correct=field==='ru'?shortRu(w):w.en;
    const opts=shuffle([correct].concat(distractors(w,field,correct)));
    Q.cur={type,field,correct,opts,ci:opts.indexOf(correct)};
    let prompt;
    if(type==='ru')prompt=`<div class="big">${esc(w.en)}</div><button class="spk" data-act="say" data-t="${esc(w.en)}" aria-label="Произнести">${ICO.spk}</button><div class="hint">Выберите перевод</div>`;
    else if(type==='en')prompt=`<div class="big ru">${esc(nodash(w.ru))}</div><div class="hint">Выберите перевод на английский</div>`;
    else prompt=`<button class="spk" style="width:96px;height:96px;margin:0" data-act="say" data-t="${esc(w.en)}" aria-label="Послушать"><svg viewBox="0 0 24 24" style="width:48px;height:48px">${ICO.spk.replace(/<\/?svg[^>]*>/g,'')}</svg></button><div class="hint">Послушайте и выберите перевод</div>`;
    body=`<div class="qprompt">${prompt}</div><div class="fb" id="fb"></div><div class="opts">${opts.map((o,i)=>`<button class="opt" data-act="pick" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
  }else if(type==='build'||type==='listenbuild'){
    Q.cur=buildSetup(w,type);
    const prompt=type==='build'?`<div class="big ru">${esc(nodash(w.ru))}</div><div class="hint">Составьте слово по-английски</div>`

  return topbar(Q.kind==='learn'?'Изучение слов':(Q.kind==='pack'?Q.extra.title:(CATN[(Q.extra||{}).c]||'Повторение')))+`<div class="qbar"><i style="width:${prog}%"></i></div><div class="qwrap">${body}</div><div class="qbottom" id="qbottom"></div>`;
}
function buildSetup(w,type){
  const tgt=enNorm(w.en.split(' / ')[0]);
  const isWords=tgt.length>26&&tgt.includes(' ');
  const toks=isWords?tgt.split(' '):tgt.split('');
  let extra;
  if(isWords){
    extra=shuffle(WORDS.filter(x=>/^[a-z]{2,6}$/i.test(x.en)&&!toks.includes(x.en.toLowerCase()))).slice(0,2).map(x=>x.en.toLowerCase());
  }else{
    const abc='abcdefghijklmnopqrstuvwxyz'.split('').filter(c=>!toks.includes(c));
    const nl=toks.filter(c=>c!==' ').length;
    extra=shuffle(abc).slice(0,nl<=5?2:nl<=9?3:4);
  }
  const tiles=shuffle(toks.concat(extra).map((t,i)=>({t,used:false})));
  return{type,tgt,isWords,tiles,toks,hint:new Set(),slots:new Array(toks.length).fill(null),res:''};
}
const dispT=(t,w)=>t===' '?'␣':(t==='i'&&w?'I':t);
function drawBuild(){
  const c=Q&&Q.cur;if(!c||!c.tiles)return;
  const sl=$('#bslots'),tl=$('#btiles');if(!sl||!tl)return;
  sl.innerHTML=c.slots.map((ti,i)=>`<button class="bsl ${c.isWords?'w':''} ${ti!=null&&c.tiles[ti].t===' '?'sp':''} ${c.hint&&c.hint.has(i)?'hint':''} ${c.res}" data-act="bslot" data-i="${i}">${ti==null?'':esc(dispT(c.tiles[ti].t,c.isWords))}</button>`).join('');
  tl.innerHTML=c.tiles.map((x,i)=>`<button class="btile ${c.isWords?'w':''} ${x.t===' '?'sp':''} ${x.used?'used':''}" data-act="btile" data-i="${i}">${esc(dispT(x.t,c.isWords))}</button>`).join('');
}
function checkBuild(){
  const c=Q&&Q.cur;if(!c||!c.tiles||view.name!=='quiz')return;
  const it=Q.items[0],w=it.w;
  const built=c.slots.map(i=>c.tiles[i].t).join(c.isWords?' ':'');
  const ok=enAnswers(w).has(enNorm(built));
  c.res=ok?'ok':'bad';drawBuild();
  answered(ok,built);afterAnswerFlow(ok,w);
}
function afterQuizRender(){
  const it=Q&&Q.items[0];if(!it)return;
  const type=it.steps[it.si];
  if(type==='ru')setTimeout(()=>speak(it.w.en),150);
  else if(type==='listen'||type==='listenwrite'||type==='listenbuild')setTimeout(()=>speak(it.w.en,true),200);
  if(type==='build'||type==='listenbuild')drawBuild();
  if(type==='write'||type==='listenwrite'){const a=$('#ans');if(a)setTimeout(()=>a.focus(),250)}
}
const seenAt=w=>{const e=E(w);return Math.max(e.r||0,e.l||0)};
const cmpRev=(a,b)=>seenAt(a)-seenAt(b)||a.n-b.n;
function applyReview(w,ok){
  const e=ens(w.key);e.r=Date.now();
  if(ok){e.w=0;if(learned(w)&&(e.d||0)<=Date.now()){e.s=Math.min((e.s||1)+1,IV.length-1);const iv=IV[e.s];e.d=dueIn(isHard(w)?Math.max(1,Math.ceil(iv/2)):iv)}}
  else{e.w=1;if(learned(w)){e.s=Math.max(1,(e.s||1)-2);e.d=dueIn(0)}}
  save();
}
function answered(ok,given){
  const it=Q.items.shift();
  const kd=it.kind||Q.kind;
  logEv(it.w,it.steps[it.si],ok,given,kd);
  if(ok){
    if(kd==='review'&&!it.miss)applyReview(it.w,true);
    it.si++;
    if(it.si<it.steps.length){Q.items.splice(Math.min(2,Q.items.length),0,it)}
    else{Q.done++;if(!it.miss){Q.first++;hardOk(it.w)}if(kd==='learn'){markLearned(it.w);const e=ens(it.w.key);e.w=it.miss?1:0;save()}}
  }else{
    it.miss=true;Q.miss++;
    if(!it.errCounted){hardErr(it.w);it.errCounted=true}
    if(kd==='review'&&!it.counted){applyReview(it.w,false);it.counted=true}
    if(kd==='learn'){ens(it.w.key).w=1;save()}
    Q.items.splice(Math.min(2,Q.items.length),0,it);
  }
  return it;
}

function startReview(c,mode){
  const pool=lists[c]();
  if(!pool.length){toast('В этой категории пока нет слов');return}
  // all words of the category, least recently seen first (so an interrupted session continues with unseen words next time)
  let words=S.set.rnd?shuffle(pool):pool.slice().sort(cmpRev);
  const lim=revLimit(words.length);if(lim)words=words.slice(0,lim);
  startQuiz('review',words,mode,{c,mode});
}

/* ---------- import ---------- */
function splitCsv(line,d){
  const out=[];let cur='',q=false;
  for(let i=0;i<line.length;i++){const c=line[i];
    if(q){if(c==='"'){if(line[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"'&&!cur.trim())q=true;
    else if(c===d){out.push(cur);cur=''}
    else cur+=c}

const hasCyr=s=>/[а-яё]/i.test(s||'');
const hasLat=s=>/[a-z]/i.test(s||'');
function clean(s){return nodash(String(s==null?'':s).replace(/\*\*(.+?)\*\*/g,'$1').replace(/<br\s*\/?>/gi,' / ').replace(/`/g,''))}
function parseImport(text){
  text=String(text||'').replace(/^﻿/,'').trim();
  const rows=[];
  if(/^[\[{]/.test(text)){
    try{
      let j=JSON.parse(text);
      if(j&&j.app==='english-words')return{backup:j};
      if(!Array.isArray(j))j=j.words||j.items||Object.entries(j).map(([en,ru])=>({en,ru}));
      j.forEach(o=>{
        if(typeof o==='string'){rows.push({en:clean(o),ru:'',note:''});return}
        const en=o.en||o.english||o.word||o.EN||'',ru=o.ru||o.russian||o.translation||o.перевод||o.RU||'';
        const note=o.note||o.notes||o.example||o.пример||o.заметка||'';
        if(en)rows.push({en:clean(en),ru:clean(ru),note:String(note||'').trim()});
      });
      return{rows};
    }catch(e){}
  }
  for(let line of text.split(/\r?\n/)){
    line=line.trim();
    if(!line||/^#/.test(line)||/^[-|:\s=]+$/.test(line)||/^```/.test(line))continue;
    line=line.replace(/^[-*•]\s+/,'').replace(/^\d+[.)]\s+(?=[A-Za-z])/,'');
    let cells;
    if(line.includes('\t'))cells=line.split('\t');
    else if(line.includes(';'))cells=splitCsv(line,';');
    else if(line.includes('|'))cells=line.replace(/^\||\|$/g,'').split('|');
    else if(/\s[—–-]\s/.test(line)){const m=line.split(/\s[—–-]\s/);cells=[m[0],m.slice(1).join(' — ')]}
    else if(line.includes(',')&&hasCyr(line)){const i=line.indexOf(',');cells=splitCsv(line,',');if(cells.length<2)cells=[line.slice(0,i),line.slice(i+1)]}
    else cells=[line];
    cells=cells.map(c=>clean(c).replace(/^"|"$/g,''));
    if(cells.length>1&&/^\d+$/.test(cells[0]))cells.shift();
    if(cells.length>=2&&hasCyr(cells[0])&&!hasCyr(cells[1])&&hasLat(cells[1])){const t=cells[0];cells[0]=cells[1];cells[1]=t}
    if(/^(en|english|word|слово|английский|английское слово|english word)$/i.test(cells[0])&&(!cells[1]||/^(ru|russian|перевод|русский|translation)$/i.test(cells[1])))continue;
    const en=cells[0];if(!en||!hasLat(en))continue;
    rows.push({en,ru:cells[1]||'',note:cells[2]||'',tp:cells[3]||''});
  }
  return{rows};
}

function findWord(en){

function runImportCheck(){
  IMP.text=$('#imptext').value;
  const p=parseImport(IMP.text);
  if(p.backup){IMP.res={backup:true};$('#impres').innerHTML=impResHtml();return}
  const rows=p.rows||[];
  if(!rows.length){IMP.res={error:'Не удалось найти слова. Проверьте формат: английское;перевод;заметка (каждое слово с новой строки).'};$('#impres').innerHTML=impResHtml();return}
  const seen=new Set();let fresh=0,dup=0,noru=0;const missing=[],ok=[],amb=[];
  if(IMP.mode==='new'){
    for(const r of rows){
      const x=normX(r.en);if(!x)continue;
      if(seen.has(x)){dup++;continue}seen.add(x);
      const rc=resolveCard(x);
      if(rc&&rc.w){dup++;continue}
      if(!r.ru){noru++;continue}
      if(rc&&rc.cands){amb.push({line:x,cands:rc.cands,pick:null,row:r});continue}
      fresh++;ok.push(r);
    }
    IMP.res={total:rows.length,fresh,dup,noru,ok,amb,sample:ok.slice(0,5).map(r=>`${r.en} — ${r.ru}`)};
  }else{
    const ws=[];const sk=new Set();
    for(const r of rows){
      const x=normX(r.en);if(!x)continue;
      const f=findWord(x);
      if(f&&f.w){if(!sk.has(f.w.key)){sk.add(f.w.key);ws.push(f.w)}}
      else if(f&&f.cands){if(!seen.has(x.toLowerCase())){seen.add(x.toLowerCase());amb.push({line:x,cands:f.cands,pick:null})}}
      else missing.push(r.en);
    }
    IMP.res={total:rows.length,found:ws.length,missing,ws,amb,sample:ws.slice(0,5).map(w=>w.en)};
  }
  $('#impres').innerHTML=impResHtml();
}

function resolveLine(raw){

  const vs=[...new Set([full,c,left].filter(Boolean))];

function checkPack(text){

    else{const k=line.toLowerCase();if(seenA.has(k)){dups++;continue}seenA.add(k);items.push({line,cands:r.cands,pick:null})}

function exampleList(w){

  const add=(en,ru)=>{en=(en||'').trim();if(!en)return;const k=norm(en);if(seen.has(k))return;seen.add(k);out.push({en,ru:(ru||'').trim()})};
  for(const e of (w.ex||[]))add(e[0],e[1]);
  for(const e of ((S.ex&&S.ex[w.key])||[]))add(e.en,e.ru);
  for(const line of String(w.note||'').split('\n')){
    const l=line.trim();if(!l)continue;
    const m=l.match(/^([A-Za-z][^А-Яа-яЁё]*?[.?!…])\s+[—–-]\s+([А-Яа-яЁё].*)$/);
    if(m)add(m[1],m[2]);
    else if(!/[А-Яа-яЁё]/.test(l)&&/[.?!]$/.test(l))add(l,'');
  }
  return out;
}
function hl(text,w){
  const vars=w.en.split(' / ').map(v=>v.replace(/…|\.\.\./g,'').trim()).filter(Boolean);
  for(const v of vars){
    const pat=v.split(/\s+/).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('\\s+');
    let m;try{m=new RegExp('\\b'+pat+"(?:s|es|ed|d|ing)?\\b",'i').exec(text)}catch(e){m=null}
    if(m)return esc(text.slice(0,m.index))+'<b>'+esc(m[0])+'</b>'+esc(text.slice(m.index+m[0].length));
  }
  return esc(text);
}

function exSave(){
  const txt=($('#exin')||{}).value||'';S.ex=S.ex||{};
  let added=0,unk=0,amb=0;
  for(const raw of txt.split('\n')){
    const line=raw.trim();if(!line)continue;
    const parts=line.split(/;|\t|\|/).map(x=>x.trim());
    if(parts.length<2)continue;
    const rc=resolveCard(parts[0]);
    if(rc&&rc.cands){amb++;continue}
    const w=rc&&rc.w;
    if(!w){unk++;continue}
    const en=parts[1],ru=parts.slice(2).join('; ');
    if(!en)continue;
    const arr=S.ex[w.key]||(S.ex[w.key]=[]);
    if(arr.some(e=>norm(e.en)===norm(en)))continue;
    arr.push({en,ru});added++;
  }
  save();
  toast(added?`Добавлено примеров: ${added}${unk?`, не найдено слов: ${unk}`:''}${amb?`, неоднозначных: ${amb} (напишите слово с точным регистром)`:''}`:(amb?'Слово совпадает с несколькими карточками: напишите его с точным регистром':(unk?'Слова из списка не найдены в словаре':'Нечего добавлять')));
  if(added){closeSheet()}
}
function exCopy(){

}

const TYPE_RU={build:'RU→EN, составить слово из букв',listenbuild:'на слух, составить слово из букв',ru:'EN→RU, выбор перевода',en:'RU→EN, выбор слова',listen:'на слух, выбор перевода',write:'RU→EN, письмо',listenwrite:'на слух, письмо'};
const ANS_TYPES=Object.keys(TYPE_RU);
function logEv(w,type,ok,given,q){
  S.log=S.log||[];
  S.log.push({t:Date.now(),k:w.key,y:type,ok:ok?1:0,g:given?String(given).slice(0,80):'',q:q||''});
  if(S.log.length>4000)S.log.splice(0,S.log.length-4000);
  save();
}
const dstr=t=>{const d=new Date(t);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const pc=(a,b)=>b?Math.round(a/b*100)+'%':'—';
function statsData(){
  const log=(S.log||[]).filter(x=>ANS_TYPES.includes(x.y));
  const all=S.log||[];
  const byW=new Map(),byType={},byLv={},byTp={},byDay={};
  for(const x of log){
    const w=BYKEY.get(x.k);
    let r=byW.get(x.k);if(!r){r={k:x.k,w,n:0,bad:0,wrong:new Map(),types:{}};byW.set(x.k,r)}
    r.n++;if(!x.ok){r.bad++;const g=x.g||'(пусто)';r.wrong.set(g,(r.wrong.get(g)||0)+1);r.types[x.y]=(r.types[x.y]||0)+1}
    const t=byType[x.y]||(byType[x.y]={n:0,ok:0});t.n++;t.ok+=x.ok;
    if(w){const l=byLv[w.lv]||(byLv[w.lv]={n:0,ok:0});l.n++;l.ok+=x.ok;const tp=byTp[w.tp]||(byTp[w.tp]={n:0,ok:0});tp.n++;tp.ok+=x.ok}
    const d=dstr(x.t);const dd=byDay[d]||(byDay[d]={n:0,ok:0});dd.n++;dd.ok+=x.ok;
  }
  const days=new Set(all.map(x=>dstr(x.t)));
  let streak=0;{let t=sod();if(!days.has(dstr(t)))t-=DAY;while(days.has(dstr(t))){streak++;t-=DAY}}
  const hard=[...byW.values()].filter(r=>r.bad>0).sort((a,b)=>b.bad-a.bad||(b.bad/b.n)-(a.bad/a.n));
  return{log,all,byW,byType,byLv,byTp,byDay,days,streak,hard,sess:S.sess||[],ok:log.reduce((a,x)=>a+x.ok,0)};
}
function wrongStr(r){return [...r.wrong.entries()].sort((a,b)=>b[1]-a[1]).slice(0,4).map(([g,c])=>`«${g}»${c>1?' ×'+c:''}`).join(', ')}

    const w=r.w;const tt=Object.keys(r.types).map(t=>TYPE_RU[t]).join('; ');

  out.push('');
  out.push('=== ПО ДНЯМ (последние 14 дней с занятиями) ===');
  Object.keys(D.byDay).sort().slice(-14).forEach(d=>{const r=D.byDay[d];out.push(`- ${d}: ответов ${r.n}, верно ${pc(r.ok,r.n)}`)});

  return out.join('\n');
}

    if(p<0)return;
    if(c.slots[p]!=null){c.tiles[c.slots[p]].used=false;c.slots[p]=null}
    let ti=c.tiles.findIndex(x=>!x.used&&x.t===c.toks[p]);
    if(ti<0){ti=c.tiles.findIndex(x=>x.t===c.toks[p]);const so=c.slots.indexOf(ti);if(so>=0&&!c.hint.has(so))c.slots[so]=null}
    if(ti<0)return;
    c.slots[p]=ti;c.tiles[ti].used=true;c.hint.add(p);

/* one-time: fill hard-word counters from the answer history recorded before this feature (one "session" = one day) */
function initHard(){
  if(S.seed.hard)return;
  const per=new Map();
  for(const x of (S.log||[])){
    if(!ANS_TYPES.includes(x.y)||!BYKEY.has(x.k))continue;
    const day=dstr(x.t);let r=per.get(x.k);if(!r){r={ec:0,ok:0,eD:'',oD:''};per.set(x.k,r)}
    if(!x.ok){if(r.eD!==day){r.eD=day;r.ec++;r.ok=0}}
    else if(r.eD!==day&&r.oD!==day){r.oD=day;r.ok++;if(r.ok>=HARD_N){r.ec=0;r.ok=0}}
  }
  for(const [k,r] of per){if(r.ec||r.ok){const e=ens(k);e.ec=r.ec;e.ok=r.ok}}
  S.seed.hard=1;save();
}
